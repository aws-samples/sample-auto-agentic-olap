[project]
name = "medical-data-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "boto3>=1.36",
  "PyJWT[crypto]>=2.10",
  "mcp>=1.9,<2",
  "metricflow @ git+https://github.com/dbt-labs/metricflow.git@afab9635481dd3e32a9f1895f37ca83bde08a920",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
