name: infra

permissions:
  contents: read

on:
  push:
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/terraform/**"]

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform fmt -check
      # The backend is a partial configuration, so init needs the environment's
      # state location. Without it Terraform prompts and the job hangs.
      - run: terraform init -backend-config=environments/prod.s3.tfbackend
      - run: terraform validate
      - name: Terraform plan (prod)
        run: terraform plan -var-file=environments/prod.tfvars -out=tfplan
      - name: Keep the reviewed plan for the apply job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 5

  # Apply runs only on main and applies exactly the plan produced above.
  # Manual approval requires required reviewers on the GitHub `prod`
  # environment (repository settings); configure them before enabling this.
  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan
          path: infra/terraform
      - run: terraform init -backend-config=environments/prod.s3.tfbackend
      - run: terraform apply tfplan
